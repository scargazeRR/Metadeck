
name: Build Metadeck EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: |
          python -m PyInstaller --onefile --windowed --icon=assets/MetaStreamdeck.ico --name=Metadeck --version-file=build/version_info.txt --hidden-import=pystray --hidden-import=PIL --hidden-import=serial --hidden-import=comtypes --collect-all pystray --collect-all PIL --collect-all serial --collect-all pycaw src/main.py
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Metadeck.exe
